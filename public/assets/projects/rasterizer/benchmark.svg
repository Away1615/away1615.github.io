<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">CPU rasterizer: baseline vs pipeline and SIMD</title><desc id="desc">Historical FPS: scene 1, 267.20 to 1061.76; scene 2, 120.32 to 550.48; scene 3, 79.22 to 234.61. Single-thread measurements from report Table 4.</desc><rect width="1200" height="720" fill="#101c28"/><g font-family="Arial,sans-serif"><text x="70" y="80" fill="#edf5f5" font-size="34" font-weight="bold">Less work. Better frame times.</text><text x="70" y="120" fill="#a2b9c4" font-size="21">CPU rasterization · single-thread pipeline + SIMD</text><text x="70" y="221" fill="#dae8ea" font-size="23">Scene 1</text><rect x="210" y="193" width="181.7" height="29" rx="4" fill="#536e80"/><rect x="210" y="235" width="722.0" height="29" rx="4" fill="#6ed8c3"/><text x="401.7" y="215" fill="#bacbd3" font-size="19">267.20</text><text x="942.0" y="258" fill="#e0fff7" font-size="19">1061.76 FPS</text><text x="70" y="364" fill="#dae8ea" font-size="23">Scene 2</text><rect x="210" y="336" width="81.8" height="29" rx="4" fill="#536e80"/><rect x="210" y="378" width="374.3" height="29" rx="4" fill="#6ed8c3"/><text x="301.8" y="358" fill="#bacbd3" font-size="19">120.32</text><text x="594.3" y="401" fill="#e0fff7" font-size="19">550.48 FPS</text><text x="70" y="507" fill="#dae8ea" font-size="23">Scene 3</text><rect x="210" y="479" width="53.9" height="29" rx="4" fill="#536e80"/><rect x="210" y="521" width="159.5" height="29" rx="4" fill="#6ed8c3"/><text x="273.9" y="501" fill="#bacbd3" font-size="19">79.22</text><text x="379.5" y="544" fill="#e0fff7" font-size="19">234.61 FPS</text><rect x="70" y="636" width="18" height="18" fill="#536e80"/><text x="100" y="652" fill="#bacbd3" font-size="18">Baseline</text><rect x="240" y="636" width="18" height="18" fill="#6ed8c3"/><text x="270" y="652" fill="#bacbd3" font-size="18">Pipeline + SIMD</text><text x="70" y="695" fill="#7e98a8" font-size="16">Source: coursework report, Table 4. Historical measurements; hardware-dependent.</text></g></svg>